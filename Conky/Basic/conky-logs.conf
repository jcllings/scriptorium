-- Conky configuration for viewing system logs (colorized by content)
-- Place both this file and conky-journal.sh in ~/.config/conky/
-- Make the script executable: chmod +x ~/.config/conky/conky-journal.sh
-- Run with: conky -c ~/.config/conky/conky-logs.conf

conky.config = {
    update_interval = 3.0,
    total_run_times = 0,
    double_buffer = true,

    -- Window settings
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'Conky',
    own_window_title = 'Conky Logs',

    -- Positioning
    alignment = 'bottom_left',
    gap_x = 362,
    gap_y = 200,
    minimum_width = 800,
    maximum_width = 1200,
    minimum_height = 1400,

    -- Appearance
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    override_utf8_locale = true,
    default_color = 'grey',
    default_outline_color = 'black',
    default_shade_color = 'black',
    draw_shades = true,
    draw_outline = false,
    draw_borders = false,
    border_width = 0,
    border_inner_margin = 5,
    border_outer_margin = 0,

    -- Performance
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    text_buffer_size = 32768,
    max_text_width = 0,
}

conky.text = [[
${font DejaVu Sans Mono:bold:size=12}${color purple}SYSTEM LOGS${color}${hr 2}
${font DejaVu Sans Mono:size=9}${color #AAAAAA}Last 60 entries (colorized by severity)${color}
${font DejaVu Sans Mono:size=9}
${execpi 3 ~/.config/conky/conky-journal.sh 60 warning}
]]
