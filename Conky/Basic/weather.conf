-- Conky 10-day Weather Panel for Otisville, MI 48463
-- Color scheme matched to original system monitor config
-- Requires: curl, jq
-- Save as ~/.config/conky/weather.conf
-- Run: conky -c ~/.config/conky/weather.conf
-- Or place weather.sh in the same directory and adjust path below

conky.config = {
    alignment = 'middle_left',
    background = false,
    border_width = 1,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=10',
    gap_x = 60,
    gap_y = 0,
    minimum_height = 5,
    minimum_width = 200,
    maximum_width = 400,
    no_buffers = true,
    own_window = true,
    own_window_class = 'ConkyWeather',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 50,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color0 = 'white',
    color1 = 'green',
    color2 = '#40d617',
    color3 = '#dfd00f',
    color4 = '#ff8800',
    color5 = '#ff4444',
    color6 = 'lightblue',
    color7 = 'cyan',
    color8 = 'OliveDrab4',
}

conky.text = [[
${color purple}${font DejaVu Sans Mono:bold:size=12}${alignc}Forecast${font}
${color orange}${alignc}Otisville, MI${color0}
${color7}${hr 2}
${execpi 1800 ~/.config/conky/weather.sh}
${color7}${hr 1}
]]

