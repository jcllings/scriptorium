-- Conky config for Pop!_OS / AMD Ryzen 5 2600 + GTX 1660 SUPER
-- Network: wlp6s0 (wireless)
-- Save as ~/.config/conky/conky.conf

conky.config = {
    alignment = 'middle_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=10',
    gap_x = 9,
    gap_y = -10,
    minimum_height = 5,
    minimum_width = 300,
    maximum_width = 340,
    net_avg_samples = 2,
    no_buffers = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'panel',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 50,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
    use_xft = true,
    color0 = 'white',
    color1 = 'green',
    color2 = '#40d617',
    color3 = '#dfd00f',
    color4 = '#ff8800',
    color5 = '#ff4444',
    color6 = 'lightblue',
    color7 = 'cyan',
    color8 = 'OliveDrab4',
}

conky.text = [[
${color purple}${font DejaVu Sans Mono:bold:size=12}${alignc}${nodename}${font}
${color orange}${alignc}${execi 3600 grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d '"'}
${color1}${alignc}Upgradable Packages:${color0} ${execi 1800 apt list --upgradable 2>/dev/null | grep -c upgradable}
${color7}${hr 1}
${color1}Uptime:${color0} ${uptime}
${color1}Kernel:${color0} ${kernel}
${color1}Load:${color0} ${loadavg}
${color7}${hr 1}
${color6}${alignc}${execi 3600 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2}
${color1}All CPU:${color0} ${goto 75}${cpu cpu0}% ${goto 110}${color8}${cpubar 6}
${color1}Core  1:${color0} ${goto 75}${cpu cpu1}% ${goto 110}${color8}${cpubar cpu1 6}
${color1}Core  2:${color0} ${goto 75}${cpu cpu2}% ${goto 110}${color8}${cpubar cpu2 6}
${color1}Core  3:${color0} ${goto 75}${cpu cpu3}% ${goto 110}${color8}${cpubar cpu3 6}
${color1}Core  4:${color0} ${goto 75}${cpu cpu4}% ${goto 110}${color8}${cpubar cpu4 6}
${color1}Core  5:${color0} ${goto 75}${cpu cpu5}% ${goto 110}${color8}${cpubar cpu5 6}
${color1}Core  6:${color0} ${goto 75}${cpu cpu6}% ${goto 110}${color8}${cpubar cpu6 6}
${color1}Freq:${color0} ${freq_g} GHz
${color1}Temp:${color0} ${execi 5 sensors | awk '/Tctl:/ {c=$2; gsub(/[^0-9.]/, "", c); f=c*9/5+32; printf "%.1f°F\n", f; exit}'}
${color7}${hr 1}
${color6}${alignc}Memory
${color1}RAM:${color0} ${mem} / ${memmax} (${memperc}%)
${color8}${membar 6}
${color1}Swap:${color0} ${swap} / ${swapmax} (${swapperc}%)
${color8}${swapbar 4}
${color7}${hr 1}
${color6}${alignc}Drive /
${color1}Used:${color0} ${fs_used /} ${color1}Free:${color0} ${fs_size /} (${fs_used_perc /}%)
${color8}${fs_bar 6 /}
${color1}Read:${color0} ${diskio_read}  ${goto 172}${color1}Write:${color0} ${diskio_write}
${diskiograph_read 20,160 00ff00 ff0000 -t} ${diskiograph_write 20,160 00ff00 ff0000 -t}
${color7}${hr 1}
${color6}${alignc}Network (wlp6s0)${color0}
${color1}Down: ${color0}${downspeed wlp6s0}/s  ${goto 172}${color1}Up: ${color0}${upspeed wlp6s0}/s
${downspeedgraph wlp6s0 25,160 00ff00 ff0000 -t} ${upspeedgraph wlp6s0 25,160 00ff00 ff0000 -t}
${color1}IP:${color0} ${addr wlp6s0}
${color7}${hr 1}
${color6}${alignc}Wireless${color0}
${color1}SSID:${color0} ${wireless_essid wlp6s0}
${color1}Signal:${color0} ${wireless_link_qual_perc wlp6s0}% 
${color8}${wireless_link_bar 4 wlp6s0}
${color7}${hr 1}
${color6}${alignc}GPU (NVIDIA GTX 1660 SUPER)${color0}
${color1}Util:${color0} ${nvidia gpuutil}%  ${color1}Temp:${color0} ${nvidia gputemp}°C
${color1}Freq:${color0} ${nvidia gpufreq} MHz
${color8}${nvidiabar 6 gpuutil}
${color1}VRAM:${color0} ${nvidia memused} / ${nvidia memmax} MiB
${color8}${nvidiabar 6 memutil}
${color1}Mem Freq:${color0} ${nvidia memfreq} MHz
${color7}${hr 1}
${color6}${alignc}Top Running Processes
${color1}Top CPU:${color0}
${top name 1} ${top cpu 1}%
${top name 2} ${top cpu 2}%
${top name 3} ${top cpu 3}%
${color1}Top MEM:${color0}
${top_mem name 1} ${top_mem mem 1}%
${top_mem name 2} ${top_mem mem 2}%
${top_mem name 3} ${top_mem mem 3}%
${color7}${hr 1}
]]
